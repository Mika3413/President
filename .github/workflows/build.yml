name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests du moteur
        run: ./gradlew :engine:test --stacktrace
      - name: APK Android (debug)
        run: ./gradlew :android:assembleDebug --stacktrace
      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: president-debug-apk
          path: android/build/outputs/apk/debug/*.apk
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: engine/build/reports/tests
